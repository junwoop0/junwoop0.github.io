<div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
  <header class="d-flex flex-column flex-md-row pb-3 mb-5 border-bottom">
    <div class="text-center text-md-start" style="width: 100%;">
      <a href="{{ site.github.url }}/" class="d-flex align-items-center justify-content-center justify-content-md-start text-decoration-none">
        <span class="fs-2 fw-bold">{{ site.title }}</span>
      </a>
    </div>
    <nav class="mt-2 mt-md-0" style="width: 100%; margin-left: 0;">
      <div class="d-flex flex-row justify-content-center justify-content-md-end">
        {% for item in site.data.settings.menu %}
          <a class="me-4 py-2 text-decoration-none" href="{{ site.github.url }}{{ item.url }}">{{ item.name }}</a>
        {% endfor %}
      </div>
    </nav>
  </header>
</div>

<style>
  header nav a:last-child {
    margin-right: 0 !important;
  }

  @media (min-width: 768px) {
    header > div:first-child {
      width: auto !important;
    }
    header > nav {
      width: auto !important;
      margin-left: auto !important;
    }
  }
</style>

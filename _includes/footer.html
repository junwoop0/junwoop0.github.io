<footer class="pt-5 my-5 text-muted border-top">

    <div class="col-md-6">
      <p class="small">Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> using the <a href="https://github.com/LeNPaul/academic" target="_blank">Academic</a> theme.</p>
    </div>
    <div class="col-md-6 text-end social-media-icons">

    </div>
  </div>
</footer>

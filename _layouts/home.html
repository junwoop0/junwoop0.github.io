---
layout: default
---

<div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
  <div class="row g-3 mb-5">
    <div class="col-md-6">
      <img src="{{ site.github.url }}/assets/img/profile.jpeg" alt="Home" style="width: 400px; height: 600px; object-fit: cover;">
    </div>
    <div class="col-md-6 d-flex flex-column">
      {{ content }}
      <div class="mt-auto">
        <a href="{{ site.github.url }}/assets/cv.pdf" class="btn btn-outline-primary" download>Download CV</a>
      </div>
    </div>
  </div>
</div>
